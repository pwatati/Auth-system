# 1. Connection settings (Points to localhost, automatically provisions 'auth_system_db')
spring.datasource.url=jdbc:mysql://localhost:3306/auth_system_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root

# Leave this completely blank since your local root database does not have a password set!
spring.datasource.password=

# 2. Hibernate configuration blocks
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect